name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@11.23.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The reproduction is the strongest claim this repository makes, so the
      # hash is recomputed here rather than trusted to whoever last ran it.
      # This runs on main and on pull requests, which is where the trigger
      # above fires, so a branch with no pull request is not yet checked.
      - name: Verify the recorded reproduction
        run: pnpm --filter @verdict/agent verify:runtime-evidence
